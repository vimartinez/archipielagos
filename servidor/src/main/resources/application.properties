spring.application.name=archipielago
# El host de contenedores (Railway) inyecta el puerto en la variable PORT.
server.port=${PORT:8080}
# Detrás del proxy HTTPS del host, usar las cabeceras X-Forwarded-* para conocer el esquema, el host y
# el puerto públicos. Sin esto, el handshake del WebSocket rechaza con 403 el Origin del navegador.
server.forward-headers-strategy=framework
